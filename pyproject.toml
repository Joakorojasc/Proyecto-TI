[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "venv", "migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM"]
ignore = ["E501", "DJ001", "DJ008"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/", ".venv/", "venv/"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q -m 'not e2e'"
markers = [
    "e2e: recorrido en navegador. Fuera de la corrida normal porque levanta servidor y Chromium.",
]

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "tests/*",
    "config/wsgi.py",
    "config/asgi.py",
    "manage.py",
]

# Para que falle bajo 90% de coverage y se mantenga  siempre. 
[tool.coverage.report]
fail_under = 90