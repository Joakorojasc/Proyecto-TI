# Configuración de nginx para el portal.
#
# nginx va delante de Gunicorn y hace tres cosas que Django no debería hacer:
# termina el HTTPS, entrega los archivos estáticos directamente desde disco, y
# reparte el tráfico. Django solo se ocupa de la lógica de la aplicación.
#
# Convive con las instancias Moodle en el mismo servidor: cada Moodle tiene su
# propio bloque server con su dominio. Este es el del portal.

server {
    listen 80;
    server_name portal.edocere.cl;
    # Todo el tráfico sin cifrar se redirige a HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portal.edocere.cl;

    ssl_certificate     /etc/letsencrypt/live/portal.edocere.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.edocere.cl/privkey.pem;

    # Tamaño máximo de subida. Lo dejamos bajo porque el portal no recibe
    # archivos grandes; sube el logo del cliente y poco más.
    client_max_body_size 10M;

    # Los archivos estáticos los entrega nginx directo desde disco. Es mucho
    # más rápido que hacerlos pasar por Python, y libera workers de Gunicorn
    # para atender peticiones reales.
    location /static/ {
        alias /opt/portal-edocere/staticfiles/;
        expires 30d;
    }

    # Todo lo demás va a Gunicorn.
    location / {
        proxy_pass http://127.0.0.1:8000;

        # Estas cabeceras le dicen a Django quién es el visitante real. Sin
        # ellas, Django creería que todas las peticiones vienen del propio
        # servidor y el registro de accesos quedaría inútil.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # El endpoint de salud no se registra en el log de accesos para no llenarlo
    # con las consultas del monitoreo, que ocurren cada pocos segundos.
    location /health/ {
        proxy_pass http://127.0.0.1:8000/health/;
        access_log off;
    }
}
